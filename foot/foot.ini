shell=fish
title=foot
font=FiraCode Nerd Font:size=17
letter-spacing=0
dpi-aware=no
pad=24x24
bold-text-in-bright=no
gamma-correct-blending=no
initial-color-theme=dark

[scrollback]
lines=10000

[cursor]
style=block

[colors-dark]
alpha=0.85
foreground=f9e0d9
background=050302
regular0=080808
regular1=ff5724
regular2=ffbe96
regular3=ffdfd2
regular4=b9ab66
regular5=f29080
regular6=ffbb84
regular7=efd2c6
bright0=b49e96
bright1=ff8764
bright2=ffd5bc
bright3=fff1ec
bright4=dcbc93
bright5=ffa999
bright6=ffd2b3
bright7=ffffff

[key-bindings]
scrollback-up-page=Control+u
scrollback-down-page=Control+d
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G

[mouse]
hide-when-typing=yes
